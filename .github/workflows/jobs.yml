name: CI Jobs

on:
    push

jobs:
    lint:
        name: Lint Codebase
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            - name: Install Dependencies
              uses: ./.github/actions/install
            - name: Run Linters
              run: |
                pnpm lint
                pnpm cargo:lint
              shell: bash
    
    build:
        name: Build Project
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            - name: Install Dependencies
              uses: ./.github/actions/install
            - name: Build Application
              run: cargo build --release
              shell: bash